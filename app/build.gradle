plugins {
    id 'com.android.application'
}

android {
    namespace 'me.screenscape.tv'
    compileSdk 34

    defaultConfig {
        applicationId "me.screenscape.tv"
        minSdk 21              // covers every Android TV / Google TV box in circulation
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            // Signed with the debug key so `assembleRelease` produces an installable APK
            // without extra setup. Replace this if you ever publish to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
}
